apiVersion: batch/v1
kind: Job
metadata:
  name: iperf-client-intra-db-udp
spec:
  template:
    metadata:
      labels:
        app: iperf-client-intra-db-udp
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: iperf-server-udp
              topologyKey: "kubernetes.io/hostname"
      restartPolicy: Never
      containers:
        - name: iperf-client
          image: amazonlinux:2023
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Aguardando 90 minutos antes de iniciar o iperf..." && \
              sleep 12 && \
              dnf update &&\
              dnf install awscli -y && \
              yum install -y iperf3 jq unzip && \
              iperf3 -c iperf-server-udp -u -t 900 -J > /tmp/result.json && \
              aws s3 cp /tmp/result.json s3://ec2-rke2-benchmark-data/iperf/intra/result-$(date +%s).json && \
              echo "[OK] JSON enviado para o S3"

