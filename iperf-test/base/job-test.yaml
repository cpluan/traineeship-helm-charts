apiVersion: batch/v1
kind: Job
metadata:
  name: iperf-client-test
spec:
  template:
    metadata:
      labels:
        app: iperf-client-test
    spec:
      restartPolicy: Never
      containers:
        - name: iperf-client
          image: amazonlinux:2023
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail

              exec > >(tee /tmp/benchmark.log) 2>&1

              echo "[INFO] Instalando dependências..."
              dnf install -y --allowerasing curl-full libcurl-full
              dnf install -y awscli jq iperf3

              PROM_URL="http://prometheus-stack-kube-prom-prometheus.monitoring.svc:9090/api/v1/query_range"

              CPU_QUERY='100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[1m])) by (instance))'
              MEM_QUERY='100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))'
              DISK_QUERY='100 - ((node_filesystem_avail_bytes{mountpoint="/", fstype!="rootfs"} * 100) / node_filesystem_size_bytes{mountpoint="/", fstype!="rootfs"})'

              echo "[INFO] Iniciando benchmark..."
              START_TS=$(date +%s)

              iperf3 -c iperf-server -t 900 -J > /tmp/result_raw.json || {
                echo "[ERRO] iperf3 falhou"; exit 1;
              }

              jq --arg node "$NODE_NAME" '. + {node_name: $node}' /tmp/result_raw.json > /tmp/result.json

              END_TS=$(date +%s)
              STEP=5
              WINDOW=300

              collect_range_metric() {
                local query="$1"
                local start_ts="$2"
                local end_ts="$3"
                local name="$4"
                local part=0
                local tmp_dir="/tmp/metric_parts_$name"
                mkdir -p "$tmp_dir"

                while [ "$start_ts" -lt "$end_ts" ]; do
                  next_ts=$((start_ts + WINDOW))
                  if [ "$next_ts" -gt "$end_ts" ]; then
                    next_ts=$end_ts
                  fi

                  echo "[INFO] Coletando $name: $start_ts → $next_ts..."
                  raw_file="/tmp/prometheus_raw_${name}_${part}.json"
                  part_file="$tmp_dir/part_$part.json"

                  if curl -sfG "$PROM_URL" \
                      --data-urlencode "query=$query" \
                      --data-urlencode "start=$start_ts" \
                      --data-urlencode "end=$next_ts" \
                      --data-urlencode "step=$STEP" > "$raw_file"; then

                    if jq -e . "$raw_file" >/dev/null 2>&1; then
                      jq '.data.result' "$raw_file" > "$part_file"
                    else
                      echo "[ERRO] JSON inválido em $raw_file"
                    fi
                  else
                    echo "[ERRO] Falha na consulta Prometheus para $name ($part)"
                  fi

                  start_ts=$next_ts
                  part=$((part + 1))
                done

                out_file="/tmp/metric_$name.json"
                if compgen -G "$tmp_dir/part_*.json" > /dev/null; then
                  jq -s 'add' "$tmp_dir"/part_*.json > "$out_file"
                else
                  echo "[]" > "$out_file"
                fi
              }

              collect_range_metric "$CPU_QUERY" "$START_TS" "$END_TS" "cpu"
              cpu_data=$(cat /tmp/metric_cpu.json)

              collect_range_metric "$MEM_QUERY" "$START_TS" "$END_TS" "mem"
              mem_data=$(cat /tmp/metric_mem.json)

              collect_range_metric "$DISK_QUERY" "$START_TS" "$END_TS" "disk"
              disk_data=$(cat /tmp/metric_disk.json)

              jq -n \
                --argjson cpu "$(echo "${cpu_data:-[]}")" \
                --argjson mem "$(echo "${mem_data:-[]}")" \
                --argjson disk "$(echo "${disk_data:-[]}")" \
                --arg start "$START_TS" \
                --arg end "$END_TS" \
                --arg node "$NODE_NAME" \
                '{
                  start: ($start | tonumber),
                  end: ($end | tonumber),
                  node_name: $node,
                  cpu: $cpu,
                  memory: $mem,
                  disk: $disk
                }' > /tmp/metrics.json

              echo "[INFO] Enviando arquivos para o S3..."
              TS=$(date +%s)
              aws s3 cp /tmp/result.json s3://ec2-rke2-benchmark-data/iperf/inter/result-$TS.json
              aws s3 cp /tmp/metrics.json s3://ec2-rke2-benchmark-data/metrics/iperf-metrics-$TS.json
              aws s3 cp /tmp/result.json s3://ec2-rke2-benchmark-data/tests/iperf/tcp/inter/$TS/result-$TS.json
              aws s3 cp /tmp/metrics.json s3://ec2-rke2-benchmark-data/tests/iperf/tcp/inter/$TS/metrics-$TS.json
              aws s3 cp /tmp/benchmark.log s3://ec2-rke2-benchmark-data/tests/iperf/tcp/inter/$TS/benchmark-$TS.log

              for rawfile in /tmp/prometheus_raw_*.json; do
                aws s3 cp "$rawfile" s3://ec2-rke2-benchmark-data/tests/iperf/tcp/inter/$TS/raw/$(basename "$rawfile")
              done

              echo "[OK] Teste finalizado e arquivos enviados"