apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: benchmark-pull-secret
  namespace: benchmark
spec:
  refreshInterval: 6h
  secretStoreRef:
    name: aws-secretstore
    kind: SecretStore
  target:
    name: benchmark-pull-secret
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "{{ .proxy_endpoint }}": {
                "username": "{{ .username }}",
                "password": "{{ .password }}"
              }
            }
          }
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ECRAuthorizationToken
          name: ecr-token-generator
