apiVersion: builtin
kind: HelmChartInflationGenerator
metadata:
  name: awx-operator
valuesInline:
  AWX:
    enabled: true
    postgres:
      enabled: false
  customVolumes:
    postgres:
      enabled: true
      size: 10Gi
      accessModes:
        - ReadWriteOnce
      storageClassName: ebs-sc

  serviceAccount:
    create: true
    name: awx-operator
