apiVersion: builtin
kind: HelmChartInflationGenerator
metadata:
  name: robusta
valuesInline:
  enablePrometheusStack: false
  enablePlatformPlaybooks: true
  enabledManagedConfiguration: true

  runner:
    sendAdditionalTelemetry: false
    enableRobustaUI: false

  # enableHolmesGPT: false
  # holmes: {}

  enableHolmesGPT: true
  holmes:
    additionalEnvVars:
    - name: MODEL
      value: gpt-4.1-nano
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          name: holmes-secrets
          key: openAiKey





