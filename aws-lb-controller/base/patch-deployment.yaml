apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-load-balancer-controller
  namespace: kube-system
spec:
  template:
    spec:
      containers:
        - name: aws-load-balancer-controller
          image: public.ecr.aws/eks/aws-load-balancer-controller:v2.6.1
          args:
            - --cluster-name=default
            - --aws-region=$(AWS_REGION)
            - --aws-vpc-id=$(VPC_ID)
          env:
            - name: VPC_ID
              valueFrom:
                configMapKeyRef:
                  name: aws-data-config
                  key: vpc-id
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: aws-data-config
                  key: aws-region
      volumes:
        - name: vpc-region-config
          emptyDir: {}
