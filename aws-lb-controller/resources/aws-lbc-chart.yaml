apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-lb-controller-chart
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/cpluan/traineeship-helm-charts.git"
    targetRevision: brenchmark/ingress-v1
    path: aws-lb-controller/base
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      selfHeal: true
