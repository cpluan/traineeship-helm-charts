apiVersion: builtin
kind: HelmChartInflationGenerator
metadata:
  name: &appName kube-prometheus-stack
valuesInline:
  # Prometheus
  prometheus:
    prometheusSpec:
      resources:
        requests:
          cpu: 20m
          memory: 1Gi
        limits:
          cpu: 300m
          memory: 1Gi


  # Alertmanager
  alertmanager:
    alertmanagerSpec:
      resources:
        requests:
          cpu: 1m
          memory: 50Mi
        limits:
          cpu: 5m
          memory: 50Mi


  # Grafana
  grafana:
    resources:
      requests:
        cpu: 15m
        memory: 100Mi
      limits:
        cpu: 200m
        memory: 100Mi     
    sidecar:
      resources:
        requests:
          cpu: 5m
          memory: 100Mi
        limits:
          cpu: 15m
          memory: 100Mi
      


  # Node Exporter
  prometheus-node-exporter:
    resources:
      requests:
        cpu: 15m
        memory: 100Mi
      limits:
        cpu: 100m
        memory: 100Mi


  # Kube State Metrics
  kube-state-metrics:
    resources:
      requests:
        cpu: 50m
        memory: 200Mi
      limits:
        cpu: 150m
        memory: 200Mi

  prometheusOperator:
    resources:
      requests:
        cpu: 50m
        memory: 200Mi
      limits:
        cpu: 150m
        memory: 200Mi

  prometheusConfigReloader:
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
      limits:
        cpu: 150m
        memory: 100Mi

  # Recursos do webhook
  webhook:
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 256Mi

   # Recursos do fleet (controller, agent, gitjob)
  fleet:
    controller:
      resources:
        requests:
          cpu: 50m
          memory: 512Mi
        limits:
          cpu: 200m
          memory: 512Mi
    agent:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 200m
          memory: 256Mi
    gitjob:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 200m
