apiVersion: builtin
kind: HelmChartInflationGenerator
metadata:
  name: &appName kube-prometheus-stack
valuesInline: 

  # Configurações do Prometheus
  prometheus:
    enabled: true
    thanosService:
      enabled: true
    thanosServiceMonitor:
      enabled: true

    
    prometheusSpec:
      retention: '32h' # Retenção de dados no Prometheus
      disableCompaction: true
      replicas: 1

      # Configurações do Thanos
      thanos:
        blockSize: 30m
        image: quay.io/thanos/thanos:v0.37.0
        objectStorageConfig:
          existingSecret:
            name: thanos-objstore-secret
            key: objstore.yml
        grpcServerTlsConfig: {}
        listenLocal: false  # Habilita o acesso remoto ao Thanos 0.0.0.0



      # # Armazenamento local (usado para blocos antes de irem pro S3)
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: ebs-sc
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 50Gi

      
  
  # Configurações do Alertmanager
  alertmanager:
    enabled: true
    alertmanagerSpec:
      replicas: 1

  # Configurações do Grafana
  grafana:
    enabled: true


  # Configurações do Node Exporter
  nodeExporter:
    enabled: true
  
  prometheus-node-exporter:
    extraArgs:
      - "--collector.ethtool"
      - --collector.ethtool.device-exclude="^(brq|tap|veth|vxlan|virbr|usb).*$" 



  # Configurações do Kube State Metrics
  kubeStateMetrics:
    enabled: true

