apiVersion: builtin
kind: HelmChartInflationGenerator
metadata:
  name: &appName kube-prometheus-stack
valuesInline:

  # Configurações do Prometheus
  prometheus:
    enabled: true
    prometheusSpec:
      replicas: 1
      # Habilita Thanos Sidecar
      thanos:
        baseImage: quay.io/thanos/thanos
        version: v0.35.1
        tsdbPath: /prometheus
        listenLocal: true
        objectStorageConfig:
          # Caminho do arquivo montado pelo ConfigMap
          file: /etc/thanos/objstore.yml
          # Monta o ConfigMap como volume
          
      additionalVolumeMounts:
        - name: thanos-objstore
          mountPath: /etc/thanos
          readOnly: true

      additionalVolumes:
        - name: thanos-objstore
          configMap:
            name: thanos-objstore-config
        
      externalLabels:
        cluster: "prod-cluster"
        replica: "a"

      # Tempo de retenção local curto
      retention: 24h
      tsdb:
        minBlockDuration: 8h
        maxBlockDuration: 8h

      # Armazenamento local (usado para blocos antes de irem pro S3)
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: ebs-sc
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 50Gi

  
        

  # Configurações do Alertmanager
  alertmanager:
    enabled: true
    alertmanagerSpec:
      replicas: 1

  # Configurações do Grafana
  grafana:
    enabled: true


  # Configurações do Node Exporter
  nodeExporter:
    enabled: true



  # Configurações do Kube State Metrics
  kubeStateMetrics:
    enabled: true

