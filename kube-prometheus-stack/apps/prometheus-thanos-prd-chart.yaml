apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-thanos-prd-chart
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1b"
spec:
  project: default
  source:
    repoURL: "https://github.com/cpluan/traineeship-helm-charts.git"
    targetRevision: benchmark/ingress-baremetal
    path: kube-prometheus-stack/overlays/thanos
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
