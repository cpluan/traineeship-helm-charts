apiVersion: v1
kind: ConfigMap
metadata:
  name: thanos-objstore-config
  namespace: monitoring
data:
  objstore.yml: |
    type: S3
    config:
      bucket: "ec2-rke2-benchmark-data"
      endpoint: "s3.amazonaws.com"
      region: "eu-west-1"
      insecure: false
      aws_sdk_auth: true
    prefix: "cluster-thanos/"
