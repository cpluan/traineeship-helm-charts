apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus-http-route
  namespace: monitoring
spec:
  parentRefs:
  - name: cluster-gw
    namespace: gateways
  hostnames:
    - prometheus.cluster-hybrid.ddnsfree.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: prometheus-stack-grafana
      port: 80


