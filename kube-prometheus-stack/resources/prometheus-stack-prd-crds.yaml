apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-stack-prd-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1a"
spec:
  project: default
  source:
    repoURL: "https://github.com/cpluan/traineeship-helm-charts.git"
    targetRevision: calico
    path: kube-prometheus-stack/overlays/prd/crds
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
    automated:
      selfHeal: true
