apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-stack-prd-CRDs
  namespace: monitoring
  annotations:
      argocd.argoproj.io/sync-wave: "2a"
spec:
  project: default
  source:
    repoURL: 'https://github.com/cpluan/traineeship-helm-charts.git'
    targetRevision: root-applications
    path: kube-prometheus-stack/overlays/prd/crds
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
