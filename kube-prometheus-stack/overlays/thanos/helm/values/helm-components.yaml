apiVersion: builtin
kind: HelmChartInflationGenerator
metadata:
  name: thanos-sidecar
valuesInline:
  existingObjstoreSecret: thanos-objstore-config
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
    prometheusRule:
      enabled: true
      default:
        absent_rules: true
        store_gateway: true
        compaction: true
        query: true

  compactor:
    enabled: true
    persistence:
      size: 50Gi

  storegateway:
    enabled: true
    persistence:
      size: 10Gi
  
  query:
    enabled: true
    replicaLabel:
      - replica
    logLevel: debug
    dnsDiscovery:
      enabled: false
    stores:
      - prometheus-operated.monitoring.svc.cluster.local:10901
    extraFlags:
      - --store=prometheus-operated.monitoring.svc.cluster.local:10901
  service:
    type: ClusterIP
    port: 10902
  containerSecurityContext:
    runAsUser: 1000
    runAsNonRoot: true
  podSecurityContext:
    fsGroup: 1000
