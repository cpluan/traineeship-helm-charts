apiVersion: builtin
kind: HelmChartInflationGenerator
metadata:
  name: thanos-sidecar
valuesInline:
  
  query:
    enabled: true
    replicaLabel:
      - replica
    logLevel: debug
    dnsDiscovery:
      enabled: false
    stores:
      - prometheus-stack-kube-prom-prometheus.monitoring.svc:10901
    extraFlags:
      - --store=prometheus-stack-kube-prom-prometheus.monitoring.svc:10901
  service:
    type: ClusterIP
    port: 10902
  containerSecurityContext:
    runAsUser: 1000
    runAsNonRoot: true
  podSecurityContext:
    fsGroup: 1000
