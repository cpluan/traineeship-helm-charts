apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iperf-test-application
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  project: default
  source:
    repoURL: "https://github.com/cpluan/traineeship-helm-charts.git"
    targetRevision: benchmark/ingress-v1
    path: iperf-test/base/
  destination:
    server: https://kubernetes.default.svc
    namespace: iperf-test
  syncPolicy:
    automated:
      selfHeal: true
