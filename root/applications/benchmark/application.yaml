apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: benchmark-application
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  project: default
  source:
    repoURL: "https://github.com/cpluan/traineeship-helm-charts.git"
    targetRevision: benchmark/ingress-baremetal
    path: benchmark/
  destination:
    server: https://kubernetes.default.svc
    namespace: benchmark
  syncPolicy:
    automated:
      selfHeal: true
