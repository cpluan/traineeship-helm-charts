apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: generic-application
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: "https://github.com/cpluan/traineeship-helm-charts.git"
    targetRevision: cni/calico-v1
    path: generic/
  destination:
    server: https://kubernetes.default.svc
    namespace: generic
  syncPolicy:
    automated:
      selfHeal: true
