apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: generic-prd-chart
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6a"
spec:
  project: default
  source:
    repoURL: "https://github.com/cpluan/traineeship-helm-charts.git"
    targetRevision: benchmark/ingress-baremetal
    path: generic/base/
  destination:
    server: https://kubernetes.default.svc
    namespace: generic
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
