apiVersion: builtin
kind: HelmChartInflationGenerator
metadata:
  name: &appName ingress-nginx
name: *appName
repo: https://kubernetes.github.io/ingress-nginx
version: 4.10.1
releaseName: ingress-nginx
namespace: ingress-nginx
valuesInline:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
