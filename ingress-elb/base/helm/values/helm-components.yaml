apiVersion: builtin
kind: HelmChartInflationGenerator
metadata:
  name: &appName ingress-nginx
name: *appName
repo: https://kubernetes.github.io/ingress-nginx
version: 4.10.1
releaseName: ingress-nginx
namespace: ingress-nginx
valuesInline:
  controller:
    replicaCount: 2
    ingressClassResource:
      name: nginx
      enabled: true
      default: false
      controllerValue: "k8s.io/ingress-nginx"
    ingressClass: nginx
    service:
      type: NodePort
      ports:
        - name: http
          port: 80
          nodePort: 1080
          targetPort: 80
        - name: https
          port: 443
          nodePort: 1443
          targetPort: 443

    
