apiVersion: builtin
kind: HelmChartInflationGenerator
metadata:
  name: &appName ingress-nginx
name: *appName
repo: https://kubernetes.github.io/ingress-nginx
version: 4.10.1
releaseName: ingress-nginx
namespace: ingress-nginx
valuesInline:
  controller:
    replicaCount: 2

    service:
      # enabled: false
      type: LoadBalancer
      targetPorts:
          http: http
          https: https
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-eip-allocations: "eipalloc-0d810c00ffbb11329, eipalloc-03150e91a911e02ad"
        service.beta.kubernetes.io/aws-load-balancer-subnets: "subnet-02221de8194852c1c, subnet-06e81141d82ea1341"
        service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
        service.beta.kubernetes.io/aws-load-balancer-target-type: "ip"
        service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
        # service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"

    # config:
    #   use-proxy-protocol: "true"
    #   real-ip-header: "proxy_protocol"
    #   use-forwarded-headers: "true"



    
