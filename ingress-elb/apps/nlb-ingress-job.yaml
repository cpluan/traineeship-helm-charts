apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nlb-ingress-job
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4b"
    argocd.argoproj.io/depends-on: nginx-ingress-application
spec:
  project: default
  source:
    repoURL: "https://github.com/cpluan/traineeship-helm-charts.git"
    targetRevision: benchmark/ingress-v1
    path: ingress-elb/jobs/
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      selfHeal: true
