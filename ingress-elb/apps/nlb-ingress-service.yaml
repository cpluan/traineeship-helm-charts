apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nlb-ingress-service
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3b"
spec:
  project: default
  source:
    repoURL: "https://github.com/cpluan/traineeship-helm-charts.git"
    targetRevision: cni/cilium-v2
    path: ingress-elb/service/
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
