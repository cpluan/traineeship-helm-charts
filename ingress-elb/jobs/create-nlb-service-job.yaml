apiVersion: batch/v1
kind: Job
metadata:
  name: create-nlb-service
  namespace: ingress-nginx
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: patch-service-sa
      restartPolicy: OnFailure
      containers:
        - name: create-service
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Aguardando o ConfigMap aws-data-config..."
              until kubectl get configmap aws-data-config -n kube-system > /dev/null 2>&1; do
                echo "Aguardando..."
                sleep 5
              done

              EIPS=$(kubectl get configmap aws-data-config -n kube-system -o jsonpath='{.data.nlb_eip_ids}')
              SUBNETS=$(kubectl get configmap aws-data-config -n kube-system -o jsonpath='{.data.public_subnets_ids}')

              echo "Criando Service ingress-nginx-controller com EIPs: $EIPS e Subnets: $SUBNETS"
              cat <<EOF | kubectl apply -f -
              apiVersion: v1
              kind: Service
              metadata:
                name: ingress-nginx-controller
                namespace: ingress-nginx
                annotations:
                  service.beta.kubernetes.io/aws-load-balancer-eip-allocations: "$EIPS"
                  service.beta.kubernetes.io/aws-load-balancer-subnets: "$SUBNETS"
                  service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
                  service.beta.kubernetes.io/aws-load-balancer-target-type: "ip"
                  service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
              
              spec:
                type: LoadBalancer
                externalTrafficPolicy: Local
                selector:
                  app.kubernetes.io/name: ingress-nginx
                  app.kubernetes.io/component: controller
                ports:
                  - name: http
                    port: 80
                    targetPort: http
                  - name: https
                    port: 443
                    targetPort: https
              EOF
