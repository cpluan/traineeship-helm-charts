apiVersion: batch/v1
kind: Job
metadata:
  name: iperf-client-test
spec:
  template:
    metadata:
      labels:
        app: iperf-client-test
    spec:
      restartPolicy: Never
      containers:
        - name: iperf-client
          image: 290115371037.dkr.ecr.eu-west-1.amazonaws.com/iperf3-benchmark:20250522-07ec8ea
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SERVER_IP
              value: 10.0.4.80
            - name: TEST_DURATION
              value: "60"
          