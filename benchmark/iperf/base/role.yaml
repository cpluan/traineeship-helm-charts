apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: benchmark
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-pods
  namespace: benchmark
subjects:
  - kind: ServiceAccount
    name: default
    namespace: benchmark
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io