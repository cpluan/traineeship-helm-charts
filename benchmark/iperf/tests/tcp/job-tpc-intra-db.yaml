apiVersion: batch/v1
kind: Job
metadata:
  name: iperf-client-intra-db-tcp
  namespace: benchmark
spec:
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      labels:
        app: iperf-client-intra-db-tcp
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: iperf-server
              topologyKey: "kubernetes.io/hostname"
      restartPolicy: Never
      imagePullSecrets:
          - name: benchmark-pull-secret
      containers:
        - name: iperf-client
          imagePullPolicy: Always
          image: 290115371037.dkr.ecr.eu-west-1.amazonaws.com/iperf3-benchmark:latest
          env:
            - name: SERVER_IP
              value: "iperf-server"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: TEST_TYPE
              value: "tcp"
            - name: TEST_SCALE
              value: "intra"
            - name: TEST_DURATION
              value: "1800"
            - name: S3_BUCKET
              value: "ec2-rke2-benchmark-data"
            - name: DEBUG_MODE
              value: "true"