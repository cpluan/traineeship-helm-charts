apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rancher-https-route
  namespace: cattle-system
spec:
  parentRefs:
  - name: cluster-gw
    namespace: gateways
    sectionName: web-ls
  hostnames:
    - rancher.cluster-hybrid.ddnsfree.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: rancher
      port: 80
