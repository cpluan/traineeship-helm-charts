apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rancher-cert
  namespace: cattle-system
spec:
  secretName: cluster-hybrid.ddnsfree.com-tls
  issuerRef:
    name: dynu
    kind: ClusterIssuer
  commonName: rancher.cluster-hybrid.ddnsfree.com
  dnsNames:
    - rancher.cluster-hybrid.ddnsfree.com
