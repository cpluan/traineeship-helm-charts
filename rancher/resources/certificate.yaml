apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
  namespace: generic
spec:
  selfSigned: {}
---

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: generic-cert
  namespace: generic
spec:
  secretName: generic-tls-secret
  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
  ipAddresses:
  - 0.0.0.0
  privateKey:
    algorithm: RSA
    size: 2048
  duration: 8760h
  renewBefore: 720h

