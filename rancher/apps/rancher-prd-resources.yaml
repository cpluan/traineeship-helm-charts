apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rancher-prd-resources
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8b"
spec:
  project: default
  source:
    repoURL: "https://github.com/cpluan/traineeship-helm-charts.git"
    targetRevision: benchmark/ingress-v1
    path: rancher/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: cattle-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
