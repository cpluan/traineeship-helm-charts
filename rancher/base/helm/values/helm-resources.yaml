apiVersion: builtin
kind: HelmChartInflationGenerator
metadata:
  name: &appName rancher
valuesInline:
  
  resources:
    requests:
      cpu: 150m
      memory: 2Gi
    limits:
      cpu: 350m
      memory: 2Gi
  
  controller:
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        cpu: 150m
        memory: 512Mi

  agent:
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 150m
        memory: 256Mi


  rancherWebhook:
    resources:
      requests: &webhookRequests
        cpu: 50m
        memory: 256Mi
      limits:
        <<: *webhookRequests
        cpu: 150m


  # Cluster API (CAPI) Controller Manager
  clusterProvisioner:
    resources:
      requests: &capiRequests
        cpu: 50m
        memory: 200Mi
      limits:
        <<: *capiRequests
        cpu: 150m
        memory: 200Mi

  certmanager:
    cainjector:
      resources:
        requests: &cainjectorRequests
          cpu: 50m
          memory: 128Mi
        limits:
          <<: *cainjectorRequests
          cpu: 150m
          memory: 128Mi

    webhook:
      resources:
        requests: &certWebhookRequests
          cpu: 50m
          memory: 128Mi
        limits:
          <<: *certWebhookRequests
          cpu: 150m
          memory: 128Mi

    manager:
      resources:
        requests: &certManagerRequests
          cpu: 50m
          memory: 256Mi
        limits:
          <<: *certManagerRequests
          cpu: 150m
          memory: 256Mi


