apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nlb-gw-job
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/cpluan/traineeship-helm-charts.git'
    targetRevision: root-applications 
    path: gateway-elb/jobs/
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
