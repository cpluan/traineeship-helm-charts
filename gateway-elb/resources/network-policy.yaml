apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "external-lockdown"
spec:
  endpointSelector: {}
  ingressDeny:
  - fromEntities:
    - "world"
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-gateway-access-from-approved-ips
spec:
  description: "Permite apenas IPs confiáveis acessarem os nodes nas portas 1080 e 1443"
  endpointSelector:
    matchExpressions:
      - key: reserved:ingress
        operator: Exists
  ingress:
    - fromCIDRSet:
        - cidr: 185.98.249.5/32     # VPN Eurotux
        - cidr: 62.28.213.98/32     # Office Bragança
        - cidr: 10.0.0.0/16
 #       - cidr: 87.196.83.38/32     # Dev
      toPorts:
        - ports:
            - port: "1080"
              protocol: TCP
            - port: "1443"
              protocol: TCP


