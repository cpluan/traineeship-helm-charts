apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "external-lockdown"
spec:
  endpointSelector: {}
  ingressDeny:
  - fromEntities:
    - "world"
  ingress:
  - fromEntities:
    - "all"
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-specific-ips-to-selected-nodes
spec:
  description: "Permite apenas IPs confiáveis acessar nós selecionados nas portas 1080/1443"
  endpointSelector:
    matchExpressions:
      - key: reserved:host
        operator: Exists
    matchLabels:
      node-role.kubernetes.io/gateway-node: "true"  # substitua pela label real dos seus nodes
  ingress:
    - fromCIDRSet:
  #      - cidr: 87.196.83.38/32     # Dev
        - cidr: 185.98.249.5/32
        - cidr: 62.28.213.98/32
      toPorts:
        - ports:
            - port: "1080"
              protocol: TCP
            - port: "1443"
              protocol: TCP

