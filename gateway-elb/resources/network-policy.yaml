apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-aws-nlb-ips
spec:
  description: "Permite apenas IPs confiáveis para tráfego no NLB nas portas HTTP e HTTPS"
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  ingress:
    - fromCIDRSet:
        - cidr: 87.196.83.38/32     # Dev
        - cidr: 185.98.249.5/32     # VPN Eurotux
        - cidr: 62.28.213.98/32     # Office Bragança
      toPorts:
        - ports:
            - port: "1080"
              protocol: TCP
            - port: "1443"
              protocol: TCP



