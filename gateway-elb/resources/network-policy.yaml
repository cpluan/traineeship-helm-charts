apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-specific-cidrs
spec:
  description: "Permitir acesso ao Gateway apenas de IPs autorizados"
  endpointSelector:
    matchExpressions:
      - key: reserved:ingress
        operator: Exists
  ingress:
    - fromCIDRSet:
        - cidr: 185.98.249.5/32   # VPN Eurotux
        - cidr: 87.196.83.38/32
        - cidr: 62.28.213.98/32   # Office Bragança


