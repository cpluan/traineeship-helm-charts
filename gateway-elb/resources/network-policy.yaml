# apiVersion: cilium.io/v2
# kind: CiliumClusterwideNetworkPolicy
# metadata:
#   name: "external-lockdown"
# spec:
#   endpointSelector: {}
#   ingressDeny:
#   - fromEntities:
#     - "world"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: restrict-argocd-by-header
  namespace: argocd
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  ingress:
    - fromEntities:
        - all
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - headers:
                  - name: x-forwarded-for
                    matches:
                      exact: "87.196.83.38"



