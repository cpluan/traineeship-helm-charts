apiVersion: v1
kind: ServiceAccount
metadata:
  name: patch-service-sa
  namespace: nlb-infra
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: patch-services-role
  namespace: nlb-infra
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "patch", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: patch-services-binding
  namespace: nlb-infra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: patch-services-role
subjects:
  - kind: ServiceAccount
    name: patch-service-sa
    namespace: nlb-infra
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: read-kube-system-cm
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
    resourceNames: ["aws-data-config"]  # ainda mais restrito
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: read-kube-system-cm-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: read-kube-system-cm
subjects:
  - kind: ServiceAccount
    name: patch-service-sa
    namespace: nlb-infra
