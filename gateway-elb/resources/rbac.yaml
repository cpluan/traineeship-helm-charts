apiVersion: v1
kind: ServiceAccount
metadata:
  name: patch-service-sa
  namespace: gateways
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: patch-service-role
  namespace: gateways
rules:
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: patch-service-binding
  namespace: gateways
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: patch-service-role
subjects:
  - kind: ServiceAccount
    name: patch-service-sa
    namespace: gateways
