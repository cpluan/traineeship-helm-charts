apiVersion: v1
kind: Service
metadata:
  name: cluster-gw-lb
  namespace: nlb-infra
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector: {} 
  ports:
    - port: 443
      protocol: TCP
      targetPort: 1443
      name: https
    - port: 80
      protocol: TCP
      targetPort: 1080
      name: http
