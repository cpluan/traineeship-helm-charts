apiVersion: v1
kind: Service
metadata:
  name: cluster-gw-lb
  namespace: nlb-infra
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector: {} 
  ports:
    - port: 443
      protocol: TCP
      targetPort: 1443
      name: https
    - port: 80
      protocol: TCP
      targetPort: 1080
      name: http
---
apiVersion: v1
kind: Endpoints
metadata:
  name: cluster-gw-lb
  namespace: nlb-infra
subsets:
  - addresses:
      - ip: 10.0.1.100  
      - ip: 10.0.2.100  
    ports:
      - port: 1443
        protocol: TCP
        name: https
      - port: 1080
        protocol: TCP
        name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthz-responder
  namespace: nlb-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: healthz-responder
  template:
    metadata:
      labels:
        app: healthz-responder
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo
          args:
            - "-listen=:80"
            - "-text=ok"
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: healthz-svc
  namespace: nlb-infra
spec:
  type: NodePort
  selector:
    app: healthz-responder
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30033

