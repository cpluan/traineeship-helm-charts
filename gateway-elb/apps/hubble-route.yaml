apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-http-route
  namespace: kube-system
spec:
  parentRefs:
  - name: cluster-gw
    namespace: gateways
    sectionName: web-ls-tls
  hostnames:
    - hubble.cluster-hybrid.ddnsfree.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: hubble-ui
      port: 80


