apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hublle-http-route
  namespace: kube-system
spec:
  parentRefs:
  - name: cluster-gw
    namespace: gateways
  hostnames:
    - hublle.cluster-hybrid.ddnsfree.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: hubble-ui
      port: 80


