apiVersion: builtin
kind: HelmChartInflationGenerator
metadata:
  name: &appName argo-cd
valuesInline:
  crds:
    install: true
    keep: true

  global:
    logging:
      format: text
      level: debug
  
  configs:
    params:
      server.insecure: true
      
    # ArgoCD ConfigMap contents:  
    cm: 
      create: true

      # OPTIONS
      exec.enabled: false
      admin.enabled: true
      server.rbac.logs.enforce.enable: true
      kustomize.buildOptions: "--enable-helm"

