apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: argocd-gateway
  namespace: argocd
spec:
  gatewayClassName: cilium
  listeners:
  - protocol: HTTP
    port: 1080
    name: web-gw
    allowedRoutes:
      namespaces:
        from: All
  # - protocol: TLS
  #   port: 1443
  #   name: web-gw-tls
  #   tls:
  #     mode: Passthrough
  #   allowedRoutes:
  #     namespaces:
  #       from: All
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: argocd-route
  namespace: argocd
spec:
  parentRefs:
    - name: argocd-gateway
  rules:
  - backendRefs:
      - name: argocd-prd-server  
        port: 30080

---
apiVersion: v1
kind: Service
metadata:
  name: argocd-gateway-lb
  namespace: argocd
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
  - port: 80
    protocol: TCP
    targetPort: 1080
  selector: {} 
---
apiVersion: v1
kind: Endpoints
metadata:
  name: argocd-gateway-lb
  namespace: argocd
subsets:
  - addresses:
      - ip: 10.0.1.103  
      - ip: 10.0.2.104  
    ports:
      - port: 1080
        protocol: TCP