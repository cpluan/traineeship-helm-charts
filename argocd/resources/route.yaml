apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: argocd-gateway
  namespace: argocd
spec:
  gatewayClassName: cilium
  
  listeners:
  - protocol: HTTP
    name: healthz-ls
    port: 30033
    allowedRoutes:
      namespaces:
        from: Same
  # - protocol: HTTP
  #   name: web-ls
  #   port: 1080
  #   hostname: "*.cluster-hybrid.ddnsfree.com"
  #   allowedRoutes:
  #     namespaces:
  #       from: All
  - protocol: TLS
    name: web-ls-tls
    port: 1443
    hostname: "*.cluster-hybrid.ddnsfree.com"
    tls:
      mode: Terminate
      certificateRefs:
        - kind: Secret
          name: cluster-hybrid.ddnsfree.com-tls
    allowedRoutes:
      namespaces:
        from: All
        
