apiVersion: gateway.networking.k8s.io/v1
kind: HTTPSRoute
metadata:
  name: argocd-route
  namespace: argocd
spec:
  parentRefs:
  - name: cluster-gw
  hostnames:
    - argocd.cluster-hybrid.duckdns.org
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: argocd-prd-server 
      port: 30443


