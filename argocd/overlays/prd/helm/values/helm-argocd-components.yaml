apiVersion: builtin
kind: HelmChartInflationGenerator
metadata:
  name: &appName argo-cd
valuesInline:
  # This patch configures the ArgoCD components
  # Enable/Disable and Amount of replicas

  # Core ArgoCD components
  controller:
    replicas: 1
    metrics: &metrics_argo
      enabled: false
      # serviceMonitor:
      #   enabled: true

  server:
    replicas: 2
    metrics: *metrics_argo
  
  repoServer:
    enabled: true
    replicas: 2
    metrics: *metrics_argo
      
  notifications:
    enabled: true

  # Redis configuration
  redis:
    enabled: true
    persistent: false
    metrics: *metrics_argo
    podAnnotations:
      app.kubernetes.io/component: redis
      app.kubernetes.io/instance: argocd-prd
      app.kubernetes.io/name: argocd-redis
     

  redis-ha:
    enabled: false
    persistent: false

  # Authentication Service
  # https://dexidp.io/
  # ArgoCD uses dex as a component, to perform authentication
  dex:
    enabled: true
    metrics: *metrics_argo
      


  applicationSet:
    # https://argo-cd.readthedocs.io/en/stable/operator-manual/applicationset/
    enabled: true
    metrics: *metrics_argo
      

